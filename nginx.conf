server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URL for the "All Projects" page: /projects serves projects.html.
    # Note: individual live demos at /projects/<project-name> are routed to
    # their own containers at the edge (Cloudflare tunnel), not here — this
    # exact-match rule only handles the bare /projects index page.
    location = /projects {
        try_files /projects.html =404;
    }

    location = /projects/ {
        return 301 /projects;
    }

    # Everything else: serve the file, then the directory, else 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
